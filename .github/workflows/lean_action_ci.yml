name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN
permissions:
  contents: read # Read access to repository contents

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      # GitHub-hosted runners fill their disk with preinstalled toolchains;
      # mathlib + module builds need several GB more. Free space first.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Challenge definitions match ThesisLean/ChallengeDefs.lean
        run: bash scripts/check_challenge_defs.sh
      - uses: leanprover/lean-action@v1
      - name: Axiom audit of the comparator theorems
        run: bash scripts/check_axioms.sh
      # Independent external kernel check: leanchecker (Lean4Lean) re-validates
      # every compiled module, guarding against elaborator/kernel discrepancies.
      # See https://github.com/digama0/lean4lean
      - name: Check with leanchecker (external independent kernel)
        run: |
          set -euo pipefail
          # Iterate over tracked source modules, not the build directory: the CI
          # cache can restore .olean files for modules that have been deleted,
          # which would otherwise be leanchecked (or silently skipped) here.
          # The olean guard skips tracked files that are not build targets
          # (e.g. AxiomAudit.lean, which imports Solution but nothing imports it).
          for src in $(git ls-files '*.lean'); do
            olean=".lake/build/lib/lean/${src%.lean}.olean"
            if [ ! -f "$olean" ]; then
              echo "leanchecker: skip $src (no olean, not a build target)"
              continue
            fi
            mod="${src%.lean}"; mod="${mod//\//.}"
            echo "leanchecker: $mod"
            lake env leanchecker "$mod"
          done
