# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4
version: "v0.4"

project:
  name: "Dynamic MCS Ordering Maintenance"
  description: >-
    A fully-dynamic Maximum-Cardinality-Search (MCS) ordering algorithm that,
    on a single-edge insertion or deletion into a loop-free undirected graph,
    scans the affected window between the two endpoints for the first step at
    which the current ordering's choice stops being a legal MCS pick, and only
    then regreedies the suffix (probe-then-repair). Correctness - every order
    produced stays a valid MCS ordering of the updated graph, and in fact
    equals the from-scratch canonical ordering - is machine-checked in Lean 4 /
    Mathlib, together with locality (the first position whose choice can change
    lies inside the window between the endpoints; after a break the suffix is
    regreedyed, so positions past the window may also change), an executable
    boolean-adjacency implementation proved to refine the
    abstract update, and per-update cost in a unit-cost query model (counting
    legality checks and pick steps along the real executable control flow): at
    most n units for an insertion and n + 1 for a deletion, so the worst case
    matches static recomputation. A stability-boundary result is also proved:
    if the neighbour count of every vertex in one graph exceeds that in the
    other by at most one along every chosen prefix, the two graphs admit a
    common MCS ordering; in particular inserting or deleting a matching, or
    flipping a single edge, always preserves a common MCS ordering.
  authors:
    - "Md Thoriqul Islam Thonmay"
    - "Gregory Morse"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Md Thoriqul Islam Thonmay"

classification:
  arxiv: ["cs.DS", "math.CO"]
  msc2020: ["05C85", "68Q25"]

sources:
  - title: >-
      Dynamic Maximum-Cardinality-Search ordering maintenance under
      single-edge insertions and deletions (probe-then-repair algorithm)
    type: original-proof
    relationship: other
    note: >-
      Formalization of the probe-then-repair strategy for dynamic MCS ordering
      maintenance under single-edge insertions and deletions. We are not aware
      of a prior formalization of dynamic MCS ordering maintenance in any
      proof assistant; the algorithm itself builds on the classical MCS
      heuristic of Tarjan and Yannakakis. The nearest prior art is Ibarra
      (SODA 1999; ACM TALG 2008), who maintains a clique-tree representation of
      a chordal graph under edge insertions and deletions, Banerjee, Raman and
      Satti (CSR 2018), who maintain a perfect elimination ordering of a
      chordal graph under edge deletions only, and Brandstadt, Dragan and
      Nicolai (1997), whose common-PEO-of-powers result is negative for MCS;
      none states our insertion+deletion locality or our stability-boundary
      result (see docs/LITERATURE.md). The correctness, locality, executable
      refinement, unit-cost (worst case n for an insertion, n + 1 for a
      deletion, matching static recomputation) and stability-boundary theorems
      are proved here in Lean 4 / Mathlib.
    authors:
      - "Md Thoriqul Islam Thonmay"
  - title: >-
      Algorithmic Aspects of Vertex Elimination on Graphs
    relationship: background
    note: >-
      Rose, Tarjan and Lueker (SIAM J. Comput. 5(2):266-283, 1976,
      doi:10.1137/0205021) introduced lexicographic breadth-first search
      (LexBFS) and linear-time chordal graph recognition. MCS was later
      introduced by Tarjan and Yannakakis as a simplified alternative; see the
      next source entry. The core MCS definition used here (pick as next the
      unchosen vertex with maximum number of already-chosen neighbors, ties
      broken by lowest index) is standard. The regreedy in this formalization is
      a naive greedy recomputation, not a bucket or Rose-Tarjan implementation;
      the unit-cost count is taken over the executable control flow, not a
      bucket data-structure cost.
    authors:
      - "Donald J. Rose"
      - "Robert Endre Tarjan"
      - "George S. Lueker"
  - title: >-
      Simple Linear-Time Algorithms to Test Chordality of Graphs, Test
      Acyclicity of Hypergraphs, and Selectively Reduce Acyclic Hypergraphs
    relationship: background
    note: >-
      Tarjan and Yannakakis (SIAM J. Comput. 13(3):566-579, 1984,
      doi:10.1137/0213035) introduced Maximum Cardinality Search (MCS) as a
      simplified alternative to LexBFS for recognizing chordal graphs. This
      formalization uses the MCS ordering defined in that paper.
    authors:
      - "Robert Endre Tarjan"
      - "Mihalis Yannakakis"
  - title: >-
      Fully Dynamic Algorithms for Chordal Graphs and Split Graphs
    relationship: background
    note: >-
      Ibarra (ACM Trans. Algorithms 4(4):40, 2008, doi:10.1145/1383369.1383371;
      conference version "Fully Dynamic Algorithms for Chordal Graphs", SODA
      1999, pp. 923-924) gives the first fully dynamic algorithm for chordal
      graphs, maintaining a clique-tree representation under edge insertions
      and deletions that preserve chordality. This is the nearest fully dynamic
      prior art; it maintains a clique tree of a chordal graph, not an MCS
      ordering of an arbitrary graph.
    authors:
      - "Louis Ibarra"
  - title: >-
      Maintaining Chordal Graphs Dynamically: Improved Upper and Lower Bounds
    relationship: background
    note: >-
      Banerjee, Raman and Satti (Computer Science - Theory and Applications,
      13th Int. Computer Science Symposium in Russia, CSR 2018, LNCS 10846,
      pp. 29-40, Springer, 2018) maintain a perfect elimination ordering of a
      chordal graph under edge deletions only (decremental), with a different
      window notion. This is the nearest prior art to the locality result here;
      it is not the same statement (it is deletion-only and maintains a PEO,
      not an MCS ordering under insertions and deletions).
    authors:
      - "Niranka Banerjee"
      - "Venkatesh Raman"
      - "Srinivasa Rao Satti"
  - title: >-
      LexBFS-orderings and powers of chordal graphs
    relationship: background
    note: >-
      Brandstadt, Dragan and Nicolai (Discrete Mathematics 171(1-3):27-42,
      1997, doi:10.1016/S0012-365X(96)00070-2) show any LexBFS-ordering of a
      chordal graph is a common PEO of its odd powers, and state that the
      analogous property fails for MCS even on trees. This is the nearest prior
      art to the stability-boundary result here; it is negative for MCS and so
      does not subsume the common-ordering theorem proved in this formalization.
    authors:
      - "Andreas Brandstadt"
      - "Feodor F. Dragan"
      - "Falk Nicolai"

related_formalizations: []

status:
  scope: >-
    Formalized for any finite n: the abstract UGraph (loop-free, symmetric
    finite graph on Fin n), the MCS legality predicate IsMCSNext (max-cardinal
    unchosen vertex, lowest-index tie-break) and its tie-break-free variant
    IsMCSOrderingAny, valid-MCS-ordering, the probe-then-repair
    init/insert/delete updates, and the correctness theorems init_valid /
    insert_update_valid / delete_update_valid together with greedySuffix_full
    and update_from_prefix. The canonical ordering is unique
    (IsMCSOrdering_unique) and each update returns exactly the from-scratch
    ordering (insert/delete_update_eq_initOrder). Locality is proved:
    legal_upto_earlierPos, legal_after_laterPos, delete_legal_between,
    insert_break_iff, and the null-update equivalences
    insert/delete_update_eq_self_iff. An executable boolean-adjacency
    implementation (execInsertUpdate / execDeleteUpdate) is proved to refine the
    abstract update (exec_insert_update_eq, exec_delete_update_eq) and is
    instrumented (execInsertUpdateC / execDeleteUpdateC) to count operations
    along the real control flow; the unit-cost bounds exec_insert_cost_le (<= n)
    and exec_delete_cost_le (<= n + 1) give the worst case matching static
    recomputation. The executable recomputation is connected to the abstract
    graph by setEdge_preserves_symm / setEdge_preserves_loopless and
    mcsOrder_eq_greedySuffix, with exec_insert_recompute_valid / exec_delete_recompute_valid. A
    stability-boundary result is proved: exists_common_ordering (neighbour
    counts differ by at most one along every prefix implies a common MCS
    ordering), with corollaries insert_matching_common_order,
    delete_matching_common_order and flip_common_order; and the matching
    obstructions are certified by kernel decide (triangle_no_common_order,
    p4_no_common_order, mixed_matching_no_common_order), showing that the +1
    bound cannot be relaxed to +2 and that the one-directional (insert-only or
    delete-only) condition cannot be dropped; the hypothesis is sufficient but
    not necessary. All headline theorems in
    Solution.lean are proved with no sorry; Challenge.lean restates them with
    deliberate sorry bodies for the comparator.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

