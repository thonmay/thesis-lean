fidelity:
  divergences: >-
    The MCS tie-breaking rule is fixed to lowest vertex index; the standard
    literature statement allows an arbitrary (but fixed) tie-break, so this is
    equivalent and explicit here. The stability results are stated on the
    tie-break-free predicate IsMCSOrderingAny (any legal pick at each step),
    which is the natural setting for the common-ordering question; the
    uniqueness results use the canonical IsMCSOrdering. The cost model is a
    unit-cost query model: each legality check and each pick step counts as one
    unit, measured by instrumented functions (execInsertUpdateC /
    execDeleteUpdateC) whose first projection equals the plain update; this is
    an operational count along the real executable control flow, not a
    bit-level or word-RAM running time. The deletion probe performs exactly one
    legality check (exec_delete_cost_of_no_break proves the cost is 1 when no
    regreedy is needed). The regreedy step (greedySuffix) is noncomputable
    (Classical.choice) in the abstract model; the executable layer
    (execRegreedyFrom via bestPick) is computable and its refinement to the
    abstract regreedy is proved (regreedy_eq_greedySuffix), so the cost count
    tracks the computable implementation.

review:
  status: "author-verified"
  reviewers:
    - "Md Thoriqul Islam Thonmay"
    - "Gregory Morse"
  notes: >-
    Every headline theorem statement in Solution.lean is textually identical to
    its Challenge.lean counterpart (same namespace Challenge, same types),
    enforced by generating both from a single source of truth
    (scripts/gen_comparator_wrappers.py). Each proof builds under lake build
    with the leanchecker external kernel checker passing and no sorry / axiom /
    admit / unsafe / native_decide in the Solution module; the AxiomAudit
    confirms all 34 comparator theorems depend only on propext, Quot.sound and
    Classical.choice. The supervisor (Gregory Morse) is the independent
    reviewer: he reviewed the theorem statements against the intended
    mathematical claims and the stability-boundary statements, and confirmed the
    worst-case cost equals static recomputation (no asymptotic separation is
    claimed).

