# formalization.yaml v0.4
version: "v0.4"

project:
  name: "Dynamic MCS Ordering Maintenance"
  description: >-
    A fully-dynamic Maximum-Cardinality-Search (MCS) ordering algorithm that,
    on a single-edge insertion or deletion into a loop-free undirected graph,
    scans the suffix from the earlier endpoint for the first step at which the
    current ordering's choice stops being a legal MCS pick (the scan result is
    filtered to the affected window between the two endpoints), and only then
    regreedies the suffix (probe-then-repair). Correctness - every order
    produced stays a valid MCS ordering of the updated graph - and per-update
    combinatorial cost O(n + m) measured by an explicit cost measure (probe
    scan length plus suffix regreedy work) are both machine-checked in Lean 4
    / Mathlib. The cost measures are combinatorial surrogates for the
    noncomputable greedy recomputation, not formalized operational running
    time; the deletion cost measure over-counts relative to the actual
    single-point deletion probe (the O(n + m) bound remains valid since a
    single check is bounded by a full suffix scan).
  authors:
    - "Md Thoriqul Islam Thonmay"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Md Thoriqul Islam Thonmay"

classification:
  arxiv: ["cs.DS", "math.CO"]
  msc2020: ["05C85", "68Q25"]

sources:
  - title: >-
      Dynamic Maximum-Cardinality-Search ordering maintenance under
      single-edge insertions and deletions (probe-then-repair algorithm)
    type: original-proof
    relationship: other
    note: >-
      Formalization of the probe-then-repair strategy for dynamic MCS ordering
      maintenance under single-edge insertions and deletions. We are not aware
      of a prior formalization of dynamic MCS ordering maintenance in any
      proof assistant; the algorithm itself builds on the classical MCS
      heuristic of Tarjan and Yannakakis. The correctness theorems and the
      O(n + m) per-update cost measure are proved here in Lean 4 / Mathlib.
    authors:
      - "Md Thoriqul Islam Thonmay"
  - title: "Maximum cardinality search: a general-purpose heuristic"
    relationship: background
    note: >-
      Background reference for the Maximum-Cardinality-Search ordering and the
      bucket / Rose-Tarjan recomputation used for the regreedy step. The core
      MCS definition (pick as next the unchosen vertex with maximum number of
      already-chosen neighbors, ties broken by lowest index) is standard.
    authors:
      - "Robert Tarjan"
      - "Mihalis Yannakakis"

related_formalizations: []

status:
  scope: >-
    Formalized for any finite n: the abstract UGraph (loop-free, symmetric
    finite graph on Fin n), the MCS legality predicate IsMCSNext (max-cardinal
    unchosen vertex, lowest-index tie-break), valid-MCS-ordering, the
    probe-then-repair init/insert/delete updates, and the correctness theorems
    init_valid / insert_update_valid / delete_update_valid together with
    greedySuffix_full and update_from_prefix. Per-update cost is formalized
    with the explicit measures insertCost / deleteCost and bounded by c*(n+m)
    in insert_complexity / delete_complexity. The executable boolean-adjacency
    recomputation is connected to the abstract graph by
    setEdge_preserves_symm / setEdge_preserves_loopless,
    mcsOrder_eq_greedySuffix, exec_insert_valid and exec_delete_valid. All
    headline theorems in Solution.lean are proved with no sorry; Challenge.lean
    restates them with deliberate sorry bodies for the comparator.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

